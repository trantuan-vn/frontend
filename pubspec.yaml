name: smartconsultor
description: smart consultor project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter    
  flutter_web_plugins:
    sdk: flutter    
  # local
  shared_preferences: ^2.2.2   
  # Service locator
  get_it: ^8.0.3
  injectable: ^2.5.0
  
  # Bloc for state management
  flutter_bloc: ^9.1.0
