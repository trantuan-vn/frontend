  flutter_svg: ^2.0.17
  fl_chart: ^0.70.2
  universal_html: ^2.2.4
  #bao mat
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3
  crypto: ^3.0.6
  flutter_web_auth_2: ^4.1.0
  flutter_appauth: ^9.0.0
  device_info_plus: ^11.3.3
  jose: ^0.3.4
  
dev_dependencies: 
